services:
  - type: web
    name: mini-runner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: E2B_API_KEY
        sync: false
      - key: RUNNER_API_KEYS
        generateValue: true
      - key: TICK_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false